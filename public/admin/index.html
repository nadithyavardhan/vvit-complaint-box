<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<title>Administration — VVIT Complaint Box</title></head>
<body data-root="../" data-admin="1">
<section id="gate" class="narrow" style="max-width:460px;padding:3rem 0">
  <div class="panel"><h1 style="font-size:1.8rem">Administrator sign in</h1>
    <p class="muted small">Authorised college staff only. Your account must be registered as an administrator.</p>
    <p class="msg" id="gateMsg" hidden></p>
    <form id="gateForm" novalidate>
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    </form></div>
</section>
<div id="app" hidden>
  <div class="admin-bar"><div class="wrap"><b>Administration</b><span id="who" class="muted" style="color:#9fb2c8;margin-right:auto"></span><button class="btn btn-ghost btn-sm" id="out">Sign out</button></div></div>
  <main id="main" class="wrap" style="padding-top:1.5rem">
    <div class="tabs" role="tablist"><button role="tab" id="tC" aria-selected="true">Complaints</button><button role="tab" id="tA" aria-selected="false">Notices</button></div>
    <section id="pC">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input class="grow" id="q" type="search" placeholder="Search token, subject, description…" aria-label="Search">
        <select id="fs" aria-label="Status"><option value="">All statuses</option><option value="submitted">Received</option><option value="in_review">Under review</option><option value="resolved">Resolved</option><option value="rejected">Closed</option></select>
        <select id="fc" aria-label="Category"><option value="">All categories</option></select>
        <button class="btn btn-outline" id="csv">Export CSV</button>
      </div>
      <div class="list" id="list"><div class="empty">Loading…</div></div>
    </section>
    <section id="pA" hidden>
      <div class="split" style="align-items:start">
        <div class="panel"><h2>Post a notice</h2><form id="annForm"><div class="field"><label class="sr" for="annText">Notice</label><textarea id="annText" maxlength="300" required style="min-height:90px"></textarea></div><p class="msg" id="annMsg" hidden></p><button class="btn btn-primary" type="submit">Publish notice</button></form></div>
        <div><h2>Awaiting approval</h2><div class="list" id="pending"></div><h2 style="margin-top:2rem">Published</h2><div class="list" id="published"></div></div>
      </div>
    </section>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dTitle"><div class="dlg-head"><div><h2 id="dTitle"></h2><span class="muted small" id="dToken"></span></div><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="dlg-body"><dl class="kv" id="dKv"></dl><hr style="border:0;border-top:1px solid var(--line);margin:1.25rem 0">
    <div class="field"><label for="dStatus">Status</label><select id="dStatus"><option value="submitted">Received</option><option value="in_review">Under review</option><option value="resolved">Resolved</option><option value="rejected">Closed (not actionable)</option></select></div>
    <div class="field"><label for="dRes">Resolution note <span class="muted">(visible to the complainant)</span></label><textarea id="dRes" maxlength="2000" style="min-height:100px"></textarea></div>
    <p class="msg" id="dMsg" hidden></p>
    <div class="cta-row" style="margin:0"><button class="btn btn-primary" id="dSave">Save changes</button><button class="btn btn-danger" id="dDel">Delete</button></div></div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/admin.js"></script>
</body></html>
